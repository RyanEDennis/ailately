name: Daily newsdesk

# Drafts one article a day in AI Lately house style, then publishes it or opens a PR.
#
# Billing: this runs Claude Code authenticated with a Pro/Max SUBSCRIPTION OAuth token
# (secret CLAUDE_CODE_OAUTH_TOKEN, generated by `claude setup-token`). Headless Claude Code
# usage currently draws on your subscription's usage limits rather than metered API credits,
# so there is no per-use API charge. No ANTHROPIC_API_KEY is used anywhere here.
#
# Guardrails are enforced as hard CI gates AFTER generation: the house-style linter
# (zero via negativa, zero anaphora, 1000-2100 words) and the guardrail tests
# (no LinkedIn/licdn in content, sourced Signal moves, no subscriber tables). A draft that
# fails either gate fails the job and never publishes.

on:
  schedule:
    - cron: "17 11 * * *"   # 11:17 UTC daily (~7:17am America/New_York)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip drafting; just run the gates on the current repo"
        type: boolean
        default: false

concurrency:
  group: daily-newsdesk
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Guardrail tests (baseline)
        run: npm run test:guardrails

      - name: Install Claude Code
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: npm install -g @anthropic-ai/claude-code

      - name: Draft today's article (subscription, via OAuth token)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN is not set. Add it under Settings -> Secrets -> Actions."
            echo "Generate it locally with:  claude setup-token   (requires a Claude Pro or Max plan)."
            exit 1
          fi
          claude -p "$(cat scripts/daily-prompt.md)" \
            --permission-mode acceptEdits \
            --allowedTools "Read,Write,Edit,Grep,Glob,WebSearch,WebFetch,Bash(node scripts/lint-style.mjs:*),Bash(node:*),Bash(ls:*),Bash(cat:*)" \
            --max-turns 60

      - name: Enforce house style and guardrails
        run: |
          npm run lint:style
          npm run test:guardrails

      - name: Detect changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain content/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new content this run — the desk stayed quiet."
          fi

      - name: Publish live (AUTO_PUBLISH)
        if: steps.changes.outputs.changed == 'true' && vars.AUTO_PUBLISH == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "AI Lately Newsdesk"
          git config user.email "editor@ailately.com"
          git add content/
          git commit -m "newsdesk: daily article for $(date -u +%Y-%m-%d)"
          git push

      - name: Open a review pull request
        if: steps.changes.outputs.changed == 'true' && vars.AUTO_PUBLISH != 'true' && github.event.inputs.dry_run != 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: newsdesk/${{ github.run_id }}
          title: "Newsdesk draft for review"
          commit-message: "newsdesk: daily draft"
          add-paths: content/
          body: |
            Automated draft from the daily newsdesk, generated on your Claude subscription.
            It passed the house-style linter and the guardrail tests. Review the facts and
            sources, then merge to publish (Vercel redeploys on merge).
