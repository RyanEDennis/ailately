name: Daily desk (Signal)

# Once a day, an agent finds the day's biggest AI people-moves and appends them to the
# current ISO week's Signal file, then refreshes the week's headline and read.
# See scripts/signal-prompt.md and docs/SIGNAL_SCHEMA.md.
#
# Billing: Claude Code runs on a Pro/Max SUBSCRIPTION OAuth token (secret
# CLAUDE_CODE_OAUTH_TOKEN). No metered ANTHROPIC_API_KEY is used.
#
# Gates (hard, after generation): the Signal validator (schema, enums, https sources,
# personal-data allowlist, dedup, zero via negativa in prose) and the guardrail tests.
#
# Publishing: live by default (commit to main). Set repository variable AUTO_PUBLISH
# to "false" to open a review pull request instead.

on:
  schedule:
    - cron: "47 11 * * *"   # 11:47 UTC daily, 30 min after the article job
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip drafting; just run the gates on the current repo"
        type: boolean
        default: false

concurrency:
  group: daily-signal
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Validate current Signal (baseline)
        run: |
          npm run validate:signal
          npm run test:guardrails

      - name: Install Claude Code
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: npm install -g @anthropic-ai/claude-code

      - name: Add today's moves (subscription, via OAuth token)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN is not set. Add it under Settings -> Secrets -> Actions."
            echo "Generate it locally with:  claude setup-token   (requires a Claude Pro or Max plan)."
            exit 1
          fi
          claude -p "$(cat scripts/signal-prompt.md)" \
            --permission-mode acceptEdits \
            --allowedTools "Read,Write,Edit,Grep,Glob,WebSearch,WebFetch,Bash(node scripts/signal-week.mjs:*),Bash(node scripts/validate-signal.mjs:*),Bash(node:*),Bash(ls:*),Bash(cat:*)" \
            --max-turns 60

      - name: Enforce Signal schema and guardrails
        run: |
          npm run validate:signal
          npm run test:guardrails

      - name: Detect changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain content/signal/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new moves this run — the Signal stayed quiet."
          fi

      - name: Publish live (default)
        if: steps.changes.outputs.changed == 'true' && vars.AUTO_PUBLISH != 'false' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "AI Lately Desk"
          git config user.email "editor@ailately.com"
          git add content/signal/
          git commit -m "signal: daily moves for $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "push retry $i"; sleep $((i * 5))
          done
          echo "push failed after retries"; exit 1

      - name: Open a review pull request (AUTO_PUBLISH=false)
        if: steps.changes.outputs.changed == 'true' && vars.AUTO_PUBLISH == 'false' && github.event.inputs.dry_run != 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: desk/signal-${{ github.run_id }}
          title: "Daily Signal update for review"
          commit-message: "signal: daily moves"
          add-paths: content/signal/
          body: |
            Automated Signal update from the daily desk, generated on your Claude subscription.
            It passed the Signal validator and the guardrail tests. Review the moves and
            sources, then merge to publish (Vercel redeploys on merge).
